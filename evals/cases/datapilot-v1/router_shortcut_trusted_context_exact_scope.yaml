schema_version: 2
id: router_shortcut_trusted_context_exact_scope
suite: datapilot-v1
entrypoint: router
tags: [v1, router, shortcut, request-context, trusted-scope, scope-no-expansion]
runtime_setup:
  request_context:
    kind: navigation_dataset_selection_v1
    dataset_date: "20270605"
    selection:
      kind: selected_clips
      clips: ["20260605_152856", "route_A_07"]
conversation:
  - role: user
    content: 处理我刚才在数据管理页选择的导航数据。
limits:
  max_model_calls: 1
  max_tool_calls: 1
  timeout_seconds: 180
expectations:
  tools:
    allowed_calls: [start_navigation_data_task]
    required_counts:
      start_navigation_data_task: 1
    handoff_count: 1
    handoff:
      operation: start
      scope_source: request_context
      dataset_date: "20270605"
      selection:
        kind: selected_clips
        clips: ["20260605_152856", "route_A_07"]
      forbidden_fields: [request, target, date, clips, segments, reason, response_language, task_id, run_id]
  response:
    forbidden_terms: [MainRouterAgent, NavigationDataAgent, start_navigation_data_task, continue_navigation_data_task, control_navigation_data_task, task_id, run_id, call_id, system prompt, 系统提示词]
