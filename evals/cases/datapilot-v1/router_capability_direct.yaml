schema_version: 2
id: router_capability_direct
suite: datapilot-v1
entrypoint: router
tags: [v1, router, direct-answer, public-safety]
conversation:
  - role: user
    content: 你能帮我做什么？
limits:
  max_model_calls: 1
  max_tool_calls: 0
  timeout_seconds: 180
expectations:
  tools:
    allowed_calls: []
    required_counts: {}
    handoff_count: 0
  response:
    language: Chinese
    required_any_groups:
      - [VLA, 导航, 数据]
    forbidden_terms:
      - MainRouterAgent
      - NavigationDataAgent
      - start_navigation_data_task
      - continue_navigation_data_task
      - control_navigation_data_task
      - task_id
      - run_id
      - call_id
      - system prompt
      - 系统提示词
    require_question: false
    max_chars: 400
