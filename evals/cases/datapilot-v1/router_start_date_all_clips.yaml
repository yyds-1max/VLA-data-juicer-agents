schema_version: 2
id: router_start_date_all_clips
suite: datapilot-v1
entrypoint: router
tags: [v1, router, start, all-clips, no-scene-mode, unique-final]
conversation:
  - role: user
    content: 请处理 20270605 的导航数据。
limits:
  max_model_calls: 1
  max_tool_calls: 1
  timeout_seconds: 180
expectations:
  tools:
    allowed_calls: [start_navigation_data_task]
    required_counts:
      start_navigation_data_task: 1
    handoff_count: 1
    handoff:
      operation: start
      scope_source: interpreted_user_text
      dataset_date: "20270605"
      selection:
        kind: all_clips
      forbidden_fields: [request, target, date, clips, segments, reason, response_language, task_id, run_id]
  response:
    forbidden_terms: [MainRouterAgent, NavigationDataAgent, start_navigation_data_task, continue_navigation_data_task, control_navigation_data_task, task_id, run_id, call_id, system prompt, 系统提示词]
