server {
    listen 8777 ssl;
    listen [::]:8777 ssl;
    server_name 120.202.207.116;

    ssl_certificate /etc/datapilot-training-center/tls/server.crt;
    ssl_certificate_key /etc/datapilot-training-center/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DataPilotTrainingTLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Public read-only health check used during Worker deployment preflight.
    location = /api/training/capabilities {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Worker enrollment exchanges a short-lived, one-time token.
    location = /api/training/nodes/enroll {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Long-running Worker traffic is an explicit endpoint allowlist. The
    # bearer token is still authenticated by the center application.
    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/heartbeat$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/commands/poll$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 35s;
    }

    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/commands/(verify|listing|command)_[A-Za-z0-9_-]{8,160}/result$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Real-training control traffic uses a queue separate from managed-data
    # commands so a long transfer cannot delay process start or stop actions.
    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/training-actions/poll$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 35s;
    }

    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/training-actions/training_action_[A-Za-z0-9_-]{8,160}/result$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/runs/run_[A-Za-z0-9_-]{8,160}/updates$" {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/dataset-releases/dataset_release_[A-Za-z0-9_-]{8,160}/manifest$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ~ "^/api/training/nodes/node_[A-Za-z0-9_-]{8,120}/dataset-files/dataset_file_[a-f0-9]{64}/content$" {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
